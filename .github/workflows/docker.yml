name: docker

on:
  pull_request:
    paths: ["Dockerfile", ".dockerignore", "packages/python/**", ".github/workflows/docker.yml"]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (downloads the 1 GB model into it)
        run: docker build -t india-address-parser .
      - name: Start the server with an API key
        run: docker run -d --name api -p 8000:8000 -e ADDRESS_API_KEY=ci-secret india-address-parser
      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 2
          done
          docker logs api
          exit 1
      - name: Reject a request without the key
        run: test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/parse -H 'Content-Type: application/json' -d '{"address":"x"}')" = "401"
      - name: Parse a real address
        run: |
          out=$(curl -sf -X POST localhost:8000/parse -H 'Authorization: Bearer ci-secret' -H 'Content-Type: application/json' \
            -d '{"address":"D.No 14/2, Gandhi Road, Pollachi, Coimbatore - 642001"}')
          echo "$out"
          echo "$out" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["pincode"]=="642001" and d["flat"]=="14/2", d'
      - name: Server logs
        if: always()
        run: docker logs api
