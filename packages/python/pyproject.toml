[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "india-address-parser"
version = "0.1.0"
description = "Parse messy Indian addresses into structured JSON with a small local model (GGUF)."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["address", "india", "parser", "gguf", "llama.cpp", "nlp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = ["llama-cpp-python>=0.3.0", "huggingface_hub>=0.23"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Model = "https://huggingface.co/abr-6024/indian-address-parser-1.5B"
GGUF = "https://huggingface.co/abr-6024/indian-address-parser-1.5B-GGUF"
Dataset = "https://huggingface.co/datasets/abr-6024/indian-address-parsing-synthetic"

[project.scripts]
india-address-parser = "india_address_parser.cli:main"

[tool.setuptools]
packages = ["india_address_parser"]
